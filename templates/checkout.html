{{define "title"}}تکمیل سفارش{{end}}

{{define "content"}}
<div class="mx-auto max-w-2xl px-5 pb-20 pt-12 lg:px-8">
  <div data-reveal>
    <h1 class="font-display text-3xl font-bold text-walnut md:text-4xl">تکمیل سفارش</h1>
  </div>

  <!-- calm step markers (single, low-friction flow) -->
  <ol class="mt-7 flex flex-wrap items-center gap-x-3 gap-y-2 text-xs" aria-label="مراحل سفارش">
    <li class="flex items-center gap-2 font-semibold text-pomegranate">
      <span class="flex h-6 w-6 items-center justify-center rounded-full bg-pomegranate text-[.6875rem] font-bold" style="color:var(--text-on-dark)">۱</span>
      اطلاعات ارسال
    </li>
    <li class="h-px w-8 bg-line" aria-hidden="true"></li>
    <li class="flex items-center gap-2 text-clay">
      <span class="flex h-6 w-6 items-center justify-center rounded-full border border-line/80 bg-sand/40 text-[.6875rem]">۲</span>
      مرور سفارش
    </li>
    <li class="h-px w-8 bg-line" aria-hidden="true"></li>
    <li class="flex items-center gap-2 text-clay">
      <span class="flex h-6 w-6 items-center justify-center rounded-full border border-line/80 bg-sand/40 text-[.6875rem]">۳</span>
      ثبت نهایی
    </li>
  </ol>

  <p class="mt-6 text-sm leading-7 text-clay">
    مبلغ قابل پرداخت: <span class="font-bold text-pomegranate">{{formatPrice .Total}}</span>
  </p>

  {{if .Error}}
  <div class="mt-5 rounded-2xl border border-rose/40 px-5 py-4 text-sm leading-7 text-pomegranate" style="background:var(--toast-error)" role="alert">{{.Error}}</div>
  {{end}}

  <!-- CHECKOUT FORM — POSTs to /checkout; redirects to /checkout/confirmation/{id} on success -->
  <form action="/checkout" method="POST" class="paper-card mt-7 overflow-hidden px-7 py-7" data-reveal>
    <div class="mb-6 flex items-center gap-2.5">
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-pomegranate text-sm font-bold" style="color:var(--text-on-dark)">۱</span>
      <h2 class="font-display text-lg font-semibold text-walnut">اطلاعات ارسال</h2>
    </div>

    <div class="space-y-5">
      <div>
        <label for="name" class="lbl block">نام و نام خانوادگی</label>
        <input type="text" id="name" name="name" required autocomplete="name"
          class="field mt-2" placeholder="مثلاً سارا محمدی">
      </div>
      <div>
        <label for="phone" class="lbl block">شماره تماس</label>
        <input type="tel" id="phone" name="phone" value="{{.Phone}}" required dir="ltr" inputmode="tel" autocomplete="tel"
          class="field mt-2 text-left" placeholder="09123456789">
      </div>
      <div>
        <label for="address" class="lbl block">آدرس تحویل</label>
        <input type="text" id="address" name="address" required autocomplete="street-address" maxlength="300"
          class="field mt-2" placeholder="استان، شهر، نشانی کامل و پلاک..">
      </div>
      <div>
        <label for="postal_code" class="lbl block">کد پستی</label>
        <input type="text" id="postal_code" name="postal_code" required dir="ltr" inputmode="numeric" autocomplete="postal-code"
          class="field mt-2 text-left" placeholder="۱۲۳۴۵۶۷۸۹۰">
      </div>
    </div>



    <button type="submit" class="btn btn-primary mt-7 w-full text-base">
      ثبت سفارش — {{formatPrice .Total}}
    </button>
  </form>
</div>
{{end}}
