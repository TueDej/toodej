{{define "title"}}خانه{{end}}

{{define "content"}}
<section class="relative overflow-hidden bg-gradient-to-br from-garnet/90 via-garnet to-forest/80 text-white">
  <div class="absolute inset-0 bg-cover bg-center" style="background-image:url('/assets/hero-bg-1.webp')"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-garnet/80 via-garnet/60 to-forest/70"></div>

  <div class="absolute bottom-0 left-0 w-full">
    <svg viewBox="0 0 1440 80" preserveAspectRatio="none" class="w-full h-16 sm:h-20">
      <path d="M0,20 C240,55 480,0 720,25 C960,50 1200,5 1440,25 L1440,80 L0,80 Z" fill="#FBF9F5"/>
      <path d="M0,35 C240,65 480,15 720,35 C960,55 1200,20 1440,35 L1440,80 L0,80 Z" fill="#2D4A3E" opacity="0.08"/>
    </svg>
  </div>

  <div class="relative mx-auto max-w-6xl px-4 py-32 text-center">
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl font-serif" style="text-shadow:0 2px 12px rgba(0,0,0,0.5)">محصولات تازه و ارگانیک</h1>
    <p class="mx-auto mt-4 max-w-2xl text-lg text-white/80" style="text-shadow:0 1px 6px rgba(0,0,0,0.4)">مستقیم از تولیدکننده به دست شما.</p>
  </div>
</section>

<!-- CATEGORY BANNERS — full-width tiles that link to the per-category listing pages -->
<section class="mx-auto max-w-6xl px-4 py-16">

  <div class="space-y-6">
    {{range .Categories}}
    <a
      href="/products/{{.Slug}}"
      class="group relative block w-full overflow-hidden rounded-sm shadow-md ring-1 ring-inset ring-black/5 transition duration-300 hover:-translate-y-1 hover:scale-[1.01] hover:shadow-2xl hover:shadow-garnet/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-garnet"
      style="background-color:{{.Bg}}">
      <!-- decorative surface tint -->
      <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_20%_30%,rgba(255,255,255,0.35),transparent_60%)]"></div>
      <div class="absolute -right-24 -top-24 h-64 w-64 rounded-full bg-white/5 blur-2xl"></div>
      <div class="absolute -bottom-16 -left-16 h-48 w-48 rounded-full bg-white/5 blur-2xl"></div>

      <div class="relative flex min-h-[14rem] sm:min-h-[18rem] flex-col justify-end p-7 sm:p-10 text-white">
        <h3 class="text-3xl font-bold font-serif sm:text-4xl" style="text-shadow:0 2px 10px rgba(0,0,0,0.35)">{{.Label}}</h3>
        <p class="mt-3 max-w-2xl text-base sm:text-lg text-white/85" style="text-shadow:0 1px 6px rgba(0,0,0,0.3)">{{.Desc}}</p>
        <span class="mt-6 inline-flex items-center gap-3 text-base font-semibold text-white transition group-hover:gap-4">
          مشاهده محصولات
          <svg class="h-5 w-5 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </span>
      </div>
    </a>
    {{end}}
  </div>
</section>
{{end}}
