{{define "title"}}ورود مدیر{{end}}

{{define "content"}}
<div class="mx-auto max-w-md px-5 pb-20 pt-16 lg:px-8">
  <div class="paper-card-sand overflow-hidden px-8 py-9" data-reveal>
    <div class="text-center">
      <img src="/assets/pomegranate.svg?v=3" alt="" class="leaf-mark mx-auto h-10 w-10">
      <h1 class="mt-3 font-display text-2xl font-bold text-walnut">ورود به پنل مدیریت</h1>
      <p class="mt-2 text-sm leading-7 text-clay">نام کاربری و رمز عبور مدیر را وارد کنید.</p>
    </div>

    <form class="mt-7 space-y-4" method="post" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div>
        <label for="username" class="lbl block">نام کاربری</label>
        <input type="text" name="username" id="username" required autocomplete="username" autofocus
          class="field mt-2">
      </div>
      <div>
        <label for="password" class="lbl block">رمز عبور</label>
        <input type="password" name="password" id="password" required autocomplete="current-password"
          class="field mt-2">
      </div>
      {{if .Error}}
      <p class="rounded-xl bg-pomegranate/10 px-4 py-2.5 text-center text-sm leading-7 text-pomegranate">{{.Error}}</p>
      {{end}}
      <button type="submit" class="btn btn-primary w-full text-base">ورود</button>
    </form>
  </div>
</div>
{{end}}
