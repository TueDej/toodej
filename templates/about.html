{{define "title"}}درباره ما{{end}}

{{define "content"}}

<!-- editorial intro -->
<section class="sec-y relative overflow-hidden bg-sand/40">
  <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-walnut/20 to-transparent" aria-hidden="true"></div>
  <div class="mx-auto max-w-4xl px-5 text-center lg:px-8" data-reveal>
    <h1 class="font-display text-4xl font-extrabold leading-[1.25] text-walnut md:text-5xl">
      محصولات تودج
    </h1>
  </div>
</section>

<!-- story body -->
<section class="mx-auto max-w-4xl px-5 pb-16 pt-16 lg:px-8">
  <div class="space-y-7 text-base leading-9 text-walnut">
    <p data-reveal>
      تودج از باغ‌های استهبان شروع شد؛ جایی که انجیر و انار زیر آفتاب پرورش می‌بینند.
    </p>
    <p data-reveal>
      ما محصولات را با همان روش‌های سنتی و بدون افزودنی آماده می‌کنیم و مستقیم برایتان می‌فرستیم.
    </p>
  </div>
</section>

<!-- imagery band -->
<section class="mx-auto max-w-5xl px-5 pb-24 lg:px-8">
  <div class="grid gap-8 sm:grid-cols-2">
    <figure data-reveal>
      <div class="rotate-[-1.3deg] overflow-hidden rounded-2xl border border-line bg-sand shadow-lift">
        <img src="/assets/fig-showcase.webp" alt="خشک‌کردن انجیر زیر آفتاب" class="aspect-[4/3] w-full object-cover">
      </div>
    </figure>
    <figure class="sm:mt-10" data-reveal>
      <div class="rotate-[1.1deg] overflow-hidden rounded-2xl border border-line bg-sand shadow-lift">
        <img src="/assets/pomegranate-showcase.webp" alt="دانه‌های انار رسیده" class="aspect-[4/3] w-full object-cover">
      </div>
    </figure>
  </div>
</section>
{{end}}
