{{define "title"}}ورود{{end}}

{{define "content"}}
<div class="mx-auto max-w-md px-5 pb-20 pt-16 lg:px-8">
  <div class="paper-card-sand overflow-hidden px-8 py-9" data-reveal>
    <div class="text-center">
      <img src="/assets/pomegranate.svg?v=3" alt="" class="leaf-mark mx-auto h-10 w-10">
      <h1 class="mt-3 font-display text-2xl font-bold text-walnut">ورود به فروشگاه</h1>
      <p id="login-desc" class="mt-2 text-sm leading-7 text-clay">شمارهٔ همراه را وارد کنید تا کد تأیید برایتان بفرستیم.</p>
    </div>

    <!-- LOGIN FORM — real <form> so Enter + button click both submit via htmx (same pattern as the code form).
         Errors are retargeted into #login-error (HX-Retarget) so the form stays on screen. -->
    <form id="login-form" class="mt-7 space-y-4" method="post" action="/auth/send-otp"
      hx-post="/auth/send-otp" hx-target="#login-form" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div>
        <label for="phone" class="lbl block">شماره همراه</label>
        <input type="tel" name="phone" id="phone" inputmode="numeric" required autocomplete="tel"
          class="field mt-2 text-left dir-ltr" placeholder="09123456789">
      </div>
      <button type="submit" class="btn btn-primary w-full text-base">دریافت کد تأیید</button>
      <!-- ERROR SLOT — SendOTP errors are retargeted here (HX-Retarget), leaving the form intact -->
      <div id="login-error"></div>
    </form>
  </div>
</div>

<script>
(function(){
  function initOTPBoxes(){
    var boxes=document.querySelectorAll('.otp-box');
    if(!boxes.length)return;
    var hidden=document.getElementById('otp-hidden');
    var form=document.getElementById('login-form');
    function combine(){var c='';boxes.forEach(function(b){c+=b.value;});if(hidden)hidden.value=c;}
    boxes.forEach(function(box,i){
      box.removeEventListener('input',box._otpHandler);
      box._otpHandler=function(){
        this.value=this.value.replace(/[^0-9]/g,'');
        if(this.value&&i<boxes.length-1)boxes[i+1].focus();
        combine();
      };
      box.addEventListener('input',box._otpHandler);
      box.removeEventListener('keydown',box._otpKeyHandler);
      box._otpKeyHandler=function(e){
        if(e.key==='Backspace'&&!this.value&&i>0){boxes[i-1].value='';boxes[i-1].focus();combine();}
      };
      box.addEventListener('keydown',box._otpKeyHandler);
      box.removeEventListener('paste',box._otpPasteHandler);
      box._otpPasteHandler=function(e){
        e.preventDefault();
        var t=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
        for(var j=0;j<boxes.length&&j<t.length;j++)boxes[j].value=t[j];
        if(t.length>0)boxes[Math.min(t.length,boxes.length-1)].focus();
        combine();
      };
      box.addEventListener('paste',box._otpPasteHandler);
    });
    if(form){form.removeEventListener('submit',form._otpSubmitHandler);form._otpSubmitHandler=combine;form.addEventListener('submit',form._otpSubmitHandler);}
    var devEl=document.getElementById('otp-dev-code');
    if(devEl&&devEl.dataset.code){for(var i=0;i<devEl.dataset.code.length&&i<boxes.length;i++)boxes[i].value=devEl.dataset.code[i];combine();}
  }

  function initResendTimer(){
    var btn=document.getElementById('resend-btn');
    var el=document.getElementById('resend-timer');
    if(!btn||!el||el.dataset.running)return;
    el.dataset.running='1';
    var s=90;
    function p(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]});}
    (function tick(){
      if(!btn||!el)return;
      if(s<=0){btn.disabled=false;el.textContent='';delete el.dataset.running;return;}
      el.textContent=p(Math.floor(s/60))+':'+p(s%60<10?'0'+s%60:s%60);
      s--;setTimeout(tick,1000);
    })();
  }

  document.addEventListener('htmx:afterSwap',function(e){initOTPBoxes();initResendTimer();});
  initOTPBoxes();
  initResendTimer();
})();
</script>
{{end}}
