{{define "title"}}ورود{{end}}

{{define "content"}}
<div class="mx-auto max-w-md px-4 py-16">
  <div class="rounded-xl bg-white p-8 shadow-sm ring-1 ring-gray-100">
    <h1 class="text-2xl font-bold text-gray-900 font-serif text-center">ورود</h1>
    <p class="mt-2 text-sm text-gray-500 text-center">برای ثبت سفارش، شماره همراه خود را وارد کنید.</p>

    <div id="login-form" class="mt-6 space-y-4">
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">شماره همراه</label>
        <input type="tel" name="phone" id="phone" inputmode="numeric" required autocomplete="tel"
          class="mt-1 block w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-left dir-ltr text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-garnet focus:ring-1 focus:ring-garnet"
          placeholder="09123456789"
          hx-post="/auth/send-otp" hx-trigger="keydown[key=='Enter']" hx-target="#login-form" hx-swap="outerHTML">
      </div>
      <button type="button"
        class="w-full rounded-lg bg-garnet px-6 py-3 font-semibold text-white shadow-sm hover:bg-garnet/90 transition"
        hx-post="/auth/send-otp" hx-include="#phone" hx-target="#login-form" hx-swap="outerHTML">
        دریافت کد تایید
      </button>
    </div>
  </div>
</div>
{{end}}
