{{define "title"}}ORDER-DETAIL{{end}}{{define "content"}}ORDER-DETAIL-PAGE{{if .Order}} id={{.Order.ID}} status={{.Order.Status}}{{end}}{{range .Items}} ITEM={{.Name}}{{end}}
<div id="order-status-controls" class="flex items-center gap-3">
  <span class="rounded-full border border-dashed px-3 py-1 text-xs font-semibold {{statusColor .Order.Status}}"
        style="background:var(--surface-warm)">{{statusLabel .Order.Status}}</span>
  {{if eq .Order.Status "dispatched"}}
  <button type="button" class="js-edit-tracking"
    data-post="/admin/orders/{{.Order.ID}}/status-badge" data-target="#order-status-controls" data-code="{{.Order.TrackingCode}}">CODE</button>
  {{end}}
</div>{{end}}
